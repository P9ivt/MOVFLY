<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دردشة</title>
  <style>
    :root {
      --bg-dark: #090712;
      --bg-glow-1: rgba(139, 92, 246, 0.28);
      --bg-glow-2: rgba(99, 102, 241, 0.18);
      --glass-bg: rgba(18, 14, 32, 0.56);
      --capsule-bg: rgba(255, 255, 255, 0.06);
      --capsule-hover: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.14);
      --capsule-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 8px 24px rgba(0, 0, 0, 0.35);
      --text-main: #f5f3ff;
      --text-muted: #b0a8d4;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --user-bubble: linear-gradient(135deg, rgba(139, 92, 246, 0.38), rgba(109, 40, 217, 0.22));
      --ai-bubble: rgba(255, 255, 255, 0.055);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 440px;
      height: 440px;
      background: var(--bg-glow-1);
      top: -110px;
      right: -90px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: var(--bg-glow-2);
      bottom: -100px;
      left: -80px;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 940px;
      height: 90vh;
      min-height: 580px;
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(145%);
      -webkit-backdrop-filter: blur(26px) saturate(145%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* شريط كبسولي زجاجي علوي */
    .top-bar {
      margin: 14px 16px 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--capsule-highlight);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    /* كبسولة زجاجية لكل عنصر تحكم */
    .capsule-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--capsule-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 13px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .capsule-pill:hover,
    .capsule-pill:focus-within {
      background: var(--capsule-hover);
      border-color: rgba(167, 139, 250, 0.55);
    }

    .capsule-pill label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .capsule-pill select,
    .capsule-pill input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      min-width: 125px;
    }

    .capsule-pill select option {
      background: #141024;
      color: #f5f3ff;
    }

    .capsule-btn {
      background: var(--capsule-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 18px rgba(0, 0, 0, 0.25);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .capsule-btn:hover {
      background: var(--capsule-hover);
      border-color: rgba(167, 139, 250, 0.55);
      transform: translateY(-1px);
    }

    .capsule-btn-accent {
      background: rgba(139, 92, 246, 0.24);
      border-color: rgba(167, 139, 250, 0.45);
    }

    .capsule-btn-accent:hover {
      background: rgba(139, 92, 246, 0.36);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 82%;
      padding: 13px 17px;
      border-radius: 22px;
      line-height: 1.7;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .msg.user {
      align-self: flex-start;
      background: var(--user-bubble);
      border-bottom-right-radius: 8px;
    }

    .msg.assistant {
      align-self: flex-end;
      background: var(--ai-bubble);
      border-bottom-left-radius: 8px;
    }

    .msg.error {
      align-self: stretch;
      max-width: 100%;
      border-radius: 999px;
      padding: 10px 18px;
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.42);
      color: #fecaca;
      font-size: 13px;
    }

    .msg-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    /* حاوية إدخال كبسولية زجاجية */
    .composer-wrap {
      padding: 0 16px 16px;
    }

    .composer {
      padding: 8px 10px 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--capsule-highlight);
      display: flex;
      gap: 10px;
      align-items: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer:focus-within {
      border-color: rgba(167, 139, 250, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 10px 28px rgba(109, 40, 217, 0.35);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 36px;
      max-height: 120px;
      padding: 7px 6px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    .send-btn {
      height: 40px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(109, 40, 217, 0.85));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 8px 20px rgba(109, 40, 217, 0.4);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .app-shell {
        height: 95vh;
        border-radius: 22px;
      }
      .top-bar {
        border-radius: 22px;
      }
      .msg {
        max-width: 92%;
      }
      .capsule-pill select,
      .capsule-pill input {
        min-width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <div class="controls-group">
        <div class="capsule-pill">
          <label for="endpointSelect">المصدر</label>
          <select id="endpointSelect" onchange="saveState()">
            <option value="https://api.apisfreellm.com/v1">apisfreellm</option>
            <option value="https://api.oneaiapikey.com/v1">oneaiapikey</option>
            <option value="https://api.experientiallabs.ai/v1">experientiallabs</option>
          </select>
        </div>

        <div class="capsule-pill">
          <label for="modelSelect">الموديلات</label>
          <select id="modelSelect" onchange="syncCustomModel()">
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
            <option value="claude-3-5-sonnet">claude-3-5-sonnet</option>
            <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          </select>
        </div>

        <div class="capsule-pill">
          <label for="customModelInput">موديل مخصص</label>
          <input id="customModelInput" type="text" placeholder="اكتب اسم الموديل" oninput="applyCustomModel()" />
        </div>

        <div class="capsule-pill">
          <label for="tokenInput">مفتاح</label>
          <input id="tokenInput" type="password" placeholder="اختياري" oninput="saveState()" />
        </div>

        <button class="capsule-btn capsule-btn-accent" type="button" onclick="fetchModels()">تحديث الموديلات</button>
      </div>

      <button class="capsule-btn" type="button" onclick="clearMessages()">مسح</button>
    </div>

    <div id="chat"></div>

    <div class="composer-wrap">
      <form class="composer" onsubmit="sendMessage(event)">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="اكتب هنا..."
          onkeydown="onKeyDown(event)"
          oninput="resizeInput(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" type="submit">إرسال</button>
      </form>
    </div>
  </div>

  <script>
    const STORE_KEY = "chat_capsule_glass_state_v3";
    const chatBox = document.getElementById("chat");
    const endpointSelect = document.getElementById("endpointSelect");
    const modelSelect = document.getElementById("modelSelect");
    const customModelInput = document.getElementById("customModelInput");
    const tokenInput = document.getElementById("tokenInput");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");

    let state = {
      baseUrl: "https://api.apisfreellm.com/v1",
      model: "gpt-4o-mini",
      token: ""
    };

    let history = [];

    function getActiveModel() {
      const custom = customModelInput.value.trim();
      return custom || modelSelect.value;
    }

    function saveState() {
      state = {
        baseUrl: endpointSelect.value,
        model: getActiveModel(),
        token: tokenInput.value.trim()
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    function syncCustomModel() {
      customModelInput.value = "";
      saveState();
    }

    function applyCustomModel() {
      const val = customModelInput.value.trim();
      if (val) {
        const exists = [...modelSelect.options].some(o => o.value === val);
        if (!exists) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          modelSelect.prepend(opt);
        }
        modelSelect.value = val;
      }
      saveState();
    }

    function loadState() {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        try {
          state = { ...state, ...JSON.parse(raw) };
        } catch (_) {}
      }
      endpointSelect.value = state.baseUrl;
      const exists = [...modelSelect.options].some(o => o.value === state.model);
      if (!exists && state.model) {
        const opt = document.createElement("option");
        opt.value = state.model;
        opt.textContent = state.model;
        modelSelect.prepend(opt);
      }
      modelSelect.value = state.model || "gpt-4o-mini";
      tokenInput.value = state.token || "";
    }

    async function fetchModels() {
      const base = endpointSelect.value.replace(/\/+$/, "");
      const token = tokenInput.value.trim();
      try {
        const res = await fetch(`${base}/models`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
        const data = await res.json();
        const list = Array.isArray(data?.data) ? data.data.map(m => m.id).filter(Boolean) : [];
        if (!list.length) {
          addError("لم يتم العثور على موديلات من هذا المصدر، يمكنك كتابة اسم الموديل في خانة موديل مخصص.");
          return;
        }
        modelSelect.innerHTML = "";
        list.forEach(id => {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = id;
          modelSelect.appendChild(opt);
        });
        modelSelect.value = list[0];
        customModelInput.value = "";
        saveState();
      } catch (err) {
        addError(`تعذر جلب قائمة الموديلات: ${err.message}`);
      }
    }

    function resizeInput(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 120) + "px";
    }

    function onKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e);
      }
    }

    function clearMessages() {
      history = [];
      chatBox.innerHTML = "";
    }

    function addBubble(cls, meta, content) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;

      const m = document.createElement("div");
      m.className = "msg-meta";
      m.textContent = meta;

      const body = document.createElement("div");
      body.textContent = content;

      div.appendChild(m);
      div.appendChild(body);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return body;
    }

    function addError(text) {
      const div = document.createElement("div");
      div.className = "msg error";
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      const base = endpointSelect.value.replace(/\/+$/, "");
      const model = getActiveModel();
      const token = tokenInput.value.trim();
      saveState();

      promptInput.value = "";
      resizeInput(promptInput);
      sendBtn.disabled = true;

      history.push({ role: "user", content: text });
      addBubble("user", "أنت", text);

      const pendingBody = addBubble("assistant", model, "...");

      try {
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch(`${base}/chat/completions`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            model,
            messages: history
          })
        });

        const data = await res.json();
        if (!res.ok) {
          const errMsg = data?.error?.message || data?.message || `HTTP ${res.status}`;
          pendingBody.parentElement.remove();
          history.pop();
          addError(errMsg);
          return;
        }

        const reply =
          data?.choices?.[0]?.message?.content ||
          data?.choices?.[0]?.text ||
          JSON.stringify(data, null, 2);

        pendingBody.textContent = reply;
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        pendingBody.parentElement.remove();
        history.pop();
        addError(err.message);
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    loadState();
  </script>
</body>
</html>
