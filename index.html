<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOAB AI — مساعد ذكي</title>
  <style>
    :root {
      --bg-dark: #090712;
      --bg-glow-1: rgba(139, 92, 246, 0.24);
      --bg-glow-2: rgba(59, 130, 246, 0.14);
      --glass-bg: rgba(20, 16, 36, 0.62);
      --glass-card: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f4f2ff;
      --text-muted: #a69ec7;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --user-bubble: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(109, 40, 217, 0.22));
      --ai-bubble: rgba(255, 255, 255, 0.05);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* توهج خلفي زجاجي */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 420px;
      height: 420px;
      background: var(--bg-glow-1);
      top: -110px;
      right: -90px;
    }

    body::after {
      width: 380px;
      height: 380px;
      background: var(--bg-glow-2);
      bottom: -100px;
      left: -80px;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      height: 90vh;
      min-height: 580px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    /* الرأس */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #4c1d95);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--glass-card);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 8px 13px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger:hover {
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }

    /* لوحة الإعدادات */
    .settings-panel {
      display: none;
      padding: 14px 20px;
      background: rgba(12, 9, 24, 0.78);
      border-bottom: 1px solid var(--glass-border);
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }

    .settings-panel.open {
      display: flex;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1 1 210px;
    }

    .field label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .field input,
    .field select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    /* منطقة المحادثة */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .welcome-card {
      margin: auto;
      max-width: 520px;
      text-align: center;
      padding: 28px 22px;
      border-radius: 20px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
    }

    .welcome-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #e9d5ff;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip:hover {
      background: rgba(139, 92, 246, 0.28);
    }

    .msg {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.7;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid var(--glass-border);
    }

    .msg.user {
      align-self: flex-start;
      background: var(--user-bubble);
      border-bottom-right-radius: 6px;
    }

    .msg.assistant {
      align-self: flex-end;
      background: var(--ai-bubble);
      border-bottom-left-radius: 6px;
    }

    .msg.error {
      align-self: stretch;
      max-width: 100%;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fecaca;
      font-size: 13px;
    }

    .msg-role {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    /* شريط الإدخال */
    .composer {
      padding: 14px 20px 18px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 150px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .send-btn {
      height: 46px;
      padding: 0 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .app-shell {
        height: 95vh;
        border-radius: 18px;
      }
      .msg {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <div class="brand-badge">JA</div>
        <div>
          <h1>JOAB AI</h1>
          <p>متصل بـ api.apisfreellm.com/v1</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn" type="button" onclick="toggleSettings()">الإعدادات</button>
        <button class="btn btn-danger" type="button" onclick="clearChat()">مسح المحادثة</button>
      </div>
    </header>

    <section class="settings-panel" id="settingsPanel">
      <div class="field">
        <label for="baseUrlInput">رابط API الأساسي</label>
        <input id="baseUrlInput" type="text" value="https://api.apisfreellm.com/v1" />
      </div>

      <div class="field">
        <label for="apiKeyInput">مفتاح API (اختياري حسب المزود)</label>
        <input id="apiKeyInput" type="password" placeholder="sk-..." />
      </div>

      <div class="field">
        <label for="modelSelect">النموذج (Model)</label>
        <select id="modelSelect">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
          <option value="deepseek-chat">deepseek-chat</option>
        </select>
      </div>

      <button class="btn" type="button" onclick="loadModels()">جلب النماذج</button>
      <button class="btn btn-primary" type="button" onclick="saveSettings()">حفظ</button>
    </section>

    <main id="chat">
      <div class="welcome-card" id="welcomeCard">
        <h2>مرحباً بك في JOAB AI</h2>
        <p>
          مساعدك الذكي المرتبط بنقطة النهاية <code>api.apisfreellm.com/v1</code>.
          يمكنك تعديل النموذج أو مفتاح API من زر الإعدادات بالأعلى، ثم البدء بالسؤال مباشرةً.
        </p>
        <div class="chips">
          <button class="chip" type="button" onclick="quickPrompt('اكتب لي ملخصاً سريعاً عن الذكاء الاصطناعي')">ملخص عن الذكاء الاصطناعي</button>
          <button class="chip" type="button" onclick="quickPrompt('ساعدني في كتابة كود بايثون بسيط ومرتب')">كود بايثون سريع</button>
          <button class="chip" type="button" onclick="quickPrompt('اقترح أفكار مشاريع تقنية حديثة')">أفكار مشاريع تقنية</button>
        </div>
      </div>
    </main>

    <form class="composer" onsubmit="handleSubmit(event)">
      <textarea
        id="promptInput"
        rows="1"
        placeholder="اكتب رسالتك إلى JOAB AI... (Enter للإرسال، Shift+Enter لسطر جديد)"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" type="submit">إرسال</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "joab_ai_config_v1";
    const chatEl = document.getElementById("chat");
    const welcomeCard = document.getElementById("welcomeCard");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");

    let config = {
      baseUrl: "https://api.apisfreellm.com/v1",
      apiKey: "",
      model: "gpt-4o-mini"
    };

    let conversation = [];

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          config = { ...config, ...JSON.parse(saved) };
        } catch (_) {}
      }
      document.getElementById("baseUrlInput").value = config.baseUrl;
      document.getElementById("apiKeyInput").value = config.apiKey;
      ensureModelOption(config.model);
      document.getElementById("modelSelect").value = config.model;
    }

    function ensureModelOption(modelName) {
      if (!modelName) return;
      const select = document.getElementById("modelSelect");
      const exists = [...select.options].some(opt => opt.value === modelName);
      if (!exists) {
        const opt = document.createElement("option");
        opt.value = modelName;
        opt.textContent = modelName;
        select.prepend(opt);
      }
    }

    function toggleSettings() {
      document.getElementById("settingsPanel").classList.toggle("open");
    }

    function saveSettings() {
      const rawUrl = document.getElementById("baseUrlInput").value.trim().replace(/\/+$/, "");
      const key = document.getElementById("apiKeyInput").value.trim();
      const model = document.getElementById("modelSelect").value.trim();

      config = {
        baseUrl: rawUrl || "https://api.apisfreellm.com/v1",
        apiKey: key,
        model: model || "gpt-4o-mini"
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      document.querySelector(".brand p").textContent = `متصل بـ ${config.baseUrl.replace(/^https?:\/\//, "")}`;
      toggleSettings();
    }

    async function loadModels() {
      const rawUrl = (document.getElementById("baseUrlInput").value.trim() || config.baseUrl).replace(/\/+$/, "");
      const key = document.getElementById("apiKeyInput").value.trim() || config.apiKey;
      const select = document.getElementById("modelSelect");

      try {
        const res = await fetch(`${rawUrl}/models`, {
          headers: key ? { Authorization: `Bearer ${key}` } : {}
        });
        const data = await res.json();
        const models = Array.isArray(data?.data) ? data.data.map(m => m.id).filter(Boolean) : [];

        if (!models.length) {
          appendError("لم يتم العثور على قائمة نماذج متاحة، يمكنك اختيار أو إدخال اسم النموذج يدوياً.");
          return;
        }

        select.innerHTML = "";
        models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          select.appendChild(opt);
        });
        select.value = models[0];
      } catch (err) {
        appendError(`تعذر جلب النماذج: ${err.message}`);
      }
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 150) + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSubmit(e);
      }
    }

    function quickPrompt(text) {
      promptInput.value = text;
      handleSubmit(new Event("submit"));
    }

    function clearChat() {
      conversation = [];
      chatEl.innerHTML = "";
      chatEl.appendChild(welcomeCard);
      welcomeCard.style.display = "block";
    }

    function appendMessage(role, label, text) {
      if (welcomeCard) welcomeCard.style.display = "none";
      const box = document.createElement("div");
      box.className = `msg ${role}`;

      const roleEl = document.createElement("div");
      roleEl.className = "msg-role";
      roleEl.textContent = label;

      const bodyEl = document.createElement("div");
      bodyEl.textContent = text;

      box.appendChild(roleEl);
      box.appendChild(bodyEl);
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bodyEl;
    }

    function appendError(message) {
      if (welcomeCard) welcomeCard.style.display = "none";
      const box = document.createElement("div");
      box.className = "msg error";
      box.textContent = message;
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = "";
      autoResize(promptInput);
      sendBtn.disabled = true;

      conversation.push({ role: "user", content: text });
      appendMessage("user", "أنت", text);

      const replyBodyEl = appendMessage("assistant", "JOAB AI", "جاري التفكير...");

      try {
        const endpoint = `${config.baseUrl.replace(/\/+$/, "")}/chat/completions`;
        const headers = {
          "Content-Type": "application/json"
        };
        if (config.apiKey) {
          headers["Authorization"] = `Bearer ${config.apiKey}`;
        }

        const response = await fetch(endpoint, {
          method: "POST",
          headers,
          body: JSON.stringify({
            model: config.model,
            messages: conversation
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const errMsg = data?.error?.message || data?.message || `خطأ HTTP ${response.status}`;
          replyBodyEl.parentElement.remove();
          appendError(`فشل الطلب من المزود: ${errMsg}`);
          conversation.pop();
          return;
        }

        const replyText =
          data?.choices?.[0]?.message?.content ||
          data?.choices?.[0]?.text ||
          JSON.stringify(data, null, 2);

        replyBodyEl.textContent = replyText;
        conversation.push({ role: "assistant", content: replyText });
      } catch (err) {
        replyBodyEl.parentElement.remove();
        appendError(
          `تعذر الاتصال بـ ${config.baseUrl}. قد يكون السبب مشكلة شبكة، أو حظر CORS من المتصفح، أو أن المزود يتطلب مفتاح API أو وسيط خادم: ${err.message}`
        );
        conversation.pop();
      } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    init();
  </script>
</body>
</html>
