<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" data-a>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" data-a>
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title data-a>MOVFLY</title>
<link data-a href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script data-a src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style data-a>
:root{
  --bg:#0b0b0e;--s:rgba(23,23,28,0.6);--s2:rgba(36,36,43,0.5);
  --tx:#f4f4f6;--mu:#a2a2af;--ln:rgba(255,255,255,0.1);
  --ac:#7c5cff;--cm:#e3a52b;--cs:#25bfae;--ca:#f2479f;
  --nav-height:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f5f8;--s:rgba(255,255,255,0.65);--s2:rgba(236,236,242,0.6);
  --tx:#17171c;--mu:#6a6a76;--ln:rgba(0,0,0,0.08);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:"Tajawal",system-ui,sans-serif;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.glass{
  background:var(--s);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--ln);
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
}
:root[data-theme="light"] .glass{
  background:rgba(255,255,255,0.65);
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 8px 32px rgba(0,0,0,0.05);
}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--mu)}

.movies{--c:var(--cm)}.series{--c:var(--cs)}.anime{--c:var(--ca)}

#top{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:600px;z-index:40;
  padding:12px 16px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all 0.3s ease;
}
#top.sc{
  background:rgba(11,11,14,0.85);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.logo{font-weight:900;font-size:20px;letter-spacing:.5px;color:var(--ac);direction:ltr;position:absolute;right:16px}
.nav-container{
  display:flex;gap:6px;background:rgba(255,255,255,0.05);
  padding:6px;border-radius:20px;backdrop-filter:blur(10px);
}
.nav-item{
  padding:10px 18px;border-radius:16px;font-weight:600;font-size:14px;
  color:var(--mu);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  cursor:pointer;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:6px;
}
.nav-item::before{
  content:"";position:absolute;inset:0;background:var(--ac);
  opacity:0;transition:opacity 0.3s;border-radius:16px;
}
.nav-item:hover::before{opacity:0.1}
.nav-item.on{
  background:var(--ac);color:#fff;font-weight:700;
  box-shadow:0 4px 12px rgba(124,92,255,0.4);
}
.nav-item:hover:not(.on){color:var(--tx)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-icons{position:absolute;left:16px;display:flex;gap:8px}
.ic{
  width:40px;height:40px;border-radius:14px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.08);border:1px solid var(--ln);
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.ic:hover{background:var(--ac);color:#fff;transform:scale(1.1);border-color:var(--ac)}
.ic:active{transform:scale(0.9)}
.ic svg{width:20px;height:20px}

#q{
  width:0;opacity:0;padding:0;border:0;
  background:var(--s);color:var(--tx);
  border-radius:20px;border:1px solid transparent;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  font:inherit;
}
#q.o{width:200px;opacity:1;padding:8px 16px;border:1px solid var(--ln);backdrop-filter:blur(10px)}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,0.2);outline:none}

.b{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 22px;border-radius:12px;
  font-weight:700;font-size:15px;
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.b:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,0.2)}
.b:active{transform:scale(0.95)}
.b.p{background:var(--tx);color:var(--bg)}
.b.s{background:var(--s2);backdrop-filter:blur(8px);border:1px solid var(--ln)}
.b.a{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(124,92,255,0.4)}
.b.a:hover{box-shadow:0 6px 20px rgba(124,92,255,0.6)}

.mobile-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(11,11,14,0.95);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--ln);
}
.mobile-nav-inner{
  display:flex;justify-content:space-around;align-items:center;
  max-width:500px;margin:0 auto;
}
.mobile-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 12px;border-radius:12px;
  color:var(--mu);font-size:11px;font-weight:600;
  transition:all 0.2s ease;min-width:60px;
}
.mobile-nav-item svg{width:22px;height:22px;transition:transform 0.2s}
.mobile-nav-item.on{color:var(--ac)}
.mobile-nav-item.on svg{transform:scale(1.1)}
.mobile-nav-item:active{transform:scale(0.9)}

.hero{
  position:relative;min-height:min(82vh,680px);
  margin-top:calc(80px + env(safe-area-inset-top,0px));
  display:flex;align-items:flex-end;padding:0 4% 9vh;overflow:hidden;
}
.art{
  position:absolute;inset:0;
  background:radial-gradient(55% 75% at 28% 28%,hsl(var(--h) 72% 46%/.95),transparent),
             radial-gradient(50% 70% at 82% 85%,hsl(calc(var(--h) + 70) 62% 32%/.9),transparent),var(--bg);
}
.art img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
.hero:hover .art img{transform:scale(1.05)}
.hero::after,.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,var(--bg) 4%,transparent 70%),linear-gradient(0deg,var(--bg) 2%,transparent 45%)}
.hi{position:relative;z-index:2;max-width:560px}
.hi h1{font-size:clamp(28px,6vw,64px);line-height:1.08;margin:8px 0 10px;font-weight:900;unicode-bidi:plaintext;text-align:start}
.ds{max-width:48ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 18px;color:var(--tx);opacity:.9}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mu)}
.badge{border:1px solid var(--c,var(--ac));color:var(--c,var(--ac));padding:0 8px;border-radius:6px;font-size:13px;font-weight:700}

.row{position:relative;margin-top:22px}
.rh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4%}
.rh h2{margin:0;font-size:clamp(18px,4vw,21px);font-weight:800}
.rh a{color:var(--mu);font-size:14px;transition:color 0.2s}
.rh a:hover{color:var(--ac)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:14px 4% 26px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.arr{position:absolute;top:44px;bottom:26px;width:3.6%;z-index:5;display:grid;place-items:center;font-size:32px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;opacity:0;transition:.2s;border-radius:8px}
.row:hover .arr{opacity:1}
.arr.l{left:0}.arr.r{right:0}
@media (hover:none){.arr{display:none}}

.card{
  flex:0 0 clamp(130px,42vw,200px);scroll-snap-align:start;text-align:start;
  position:relative;border-radius:16px;
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
}
.card:hover{transform:translateY(-12px) scale(1.03);z-index:4;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.card:active{transform:scale(0.98)}
.poster{
  position:relative;overflow:hidden;aspect-ratio:2/3;border-radius:16px;
  display:flex;align-items:flex-end;padding:16px;direction:ltr;text-align:left;color:#fff;
  background:linear-gradient(135deg,hsl(var(--h) 65% 40%),hsl(calc(var(--h) + 50) 60% 20%));
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.poster::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.8) 100%);
  z-index:1;
}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
.card:hover .poster img{transform:scale(1.1)}
.poster b{
  position:relative;font-size:clamp(14px,3.5vw,16px);line-height:1.3;font-weight:800;
  text-shadow:0 2px 12px rgba(0,0,0,0.8);z-index:2;
}
.poster.im b{display:none}

.movies .poster{border-radius:12px}
.movies .poster::after{
  content:"";position:absolute;top:12px;right:12px;width:8px;height:8px;
  background:var(--cm);border-radius:50%;box-shadow:0 0 12px var(--cm);z-index:3;
}
.series .poster::after{
  content:"";position:absolute;top:12px;right:12px;width:8px;height:8px;
  background:var(--cs);border-radius:50%;box-shadow:0 0 12px var(--cs);z-index:3;
}
.anime .poster::after{
  content:"";position:absolute;top:12px;right:12px;width:8px;height:8px;
  background:var(--ca);border-radius:50%;box-shadow:0 0 12px var(--ca);z-index:3;
}
.poster.im::before,.poster.im::after{display:none}
.movies .poster.im,.anime .poster.im{border:0;border-radius:16px}

.ho{
  position:absolute;inset:0;border-radius:16px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:linear-gradient(0deg,rgba(0,0,0,.95),transparent 70%);
  opacity:0;transition:0.3s ease;color:#fff;z-index:3;
}
.card:hover .ho{opacity:1}
.ho b{font-size:14px;unicode-bidi:plaintext;margin-bottom:4px}
.ho small{opacity:.8;font-size:12px}

.nm{display:flex;align-items:flex-end;flex:0 0 auto}
.nm .card{flex:0 0 clamp(110px,13vw,150px)}
.nm i{font:900 clamp(90px,14vw,150px)/.8 Tajawal,sans-serif;-webkit-text-stroke:3px var(--mu);color:transparent;margin-inline-end:-16px;z-index:1;direction:ltr}

.ph{padding:120px 4% 14px}
.ph h1{margin:0;font-size:clamp(28px,6vw,38px);font-weight:900}
.ph h1::after{content:"";display:block;width:50px;height:4px;background:var(--c,var(--ac));margin-top:8px;border-radius:2px}
.ph p{margin:8px 0 0;color:var(--mu)}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 4% 18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:8px 18px;border-radius:999px;border:1px solid var(--ln);
  font-weight:500;transition:all 0.2s ease;background:var(--s2);
  white-space:nowrap;flex-shrink:0;
}
.chip:hover{border-color:var(--mu)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700;transform:scale(1.05)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px;padding:0 4%}
.em{padding:0 4%;color:var(--mu)}

#foot{margin-top:34px;padding:34px 4% 100px;text-align:center;color:var(--mu);font-size:14px;border-top:1px solid var(--ln)}
#foot p{margin:4px 0}

.mv{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:60;overflow:auto;display:flex;justify-content:center;padding:4vh 12px}
.md{
  border-radius:24px;width:100%;max-width:820px;height:fit-content;overflow:hidden;
  animation:modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

.mh{position:relative;height:300px;display:flex;align-items:flex-end;padding:22px}
.mh::after{background:linear-gradient(0deg,var(--s),transparent 70%)}
.mh .hi{z-index:3}.mh h1{font-size:30px;margin:0 0 12px}
.mh .x{
  position:absolute;top:12px;inset-inline-end:12px;z-index:4;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,0.2);transition:all 0.2s;
}
.mh .x:hover{background:rgba(255,255,255,0.2);transform:rotate(90deg)}
.mh .x svg{width:20px;height:20px}

.mb{padding:4px 22px 24px}
.mb h3{margin:18px 0 4px}
.ep{
  display:flex;gap:14px;align-items:center;padding:14px 8px;
  border-bottom:1px solid var(--ln);cursor:pointer;border-radius:12px;
  transition:background 0.2s;
}
.ep:hover{background:var(--s2)}
.ep b{font-size:22px;color:var(--mu);min-width:30px}

.tg{
  position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:var(--bg);padding:12px 24px;border-radius:16px;
  z-index:100;max-width:90%;text-align:center;font-weight:600;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);backdrop-filter:blur(10px);
  opacity:0;animation:toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}

.password-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);
  z-index:100;display:grid;place-items:center;padding:20px;
}
.password-box{
  background:var(--s);border:1px solid var(--ln);
  border-radius:24px;padding:32px;max-width:400px;width:100%;
  text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.5);
  animation:modalIn 0.3s ease;
}
.password-box h2{margin:0 0 8px;font-size:24px}
.password-box p{color:var(--mu);margin:0 0 24px}
.password-box input{
  width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--ln);
  background:var(--s2);color:var(--tx);font-size:16px;margin-bottom:16px;
  text-align:center;letter-spacing:2px;
}
.password-box input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,0.2)}
.password-box button{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px}

#pl{position:fixed;inset:0;background:#000;z-index:80;color:#fff;user-select:none;direction:ltr}
#pl video{width:100%;height:100%;object-fit:contain;background:#000}
#pl.hide{cursor:none}
.pc{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(0,0,0,.6),transparent 22%,transparent 70%,rgba(0,0,0,.8));
  backdrop-filter:blur(4px);transition:opacity .3s;pointer-events:none;
}
.pc>*{pointer-events:auto}
#pl.hide .pc{opacity:0}
.pt{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px}
.sk{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.25);cursor:pointer;margin-bottom:10px;transition:height .1s}
.sk:hover{height:8px}
.sk i{position:absolute;inset:0 auto 0 0;border-radius:3px;width:0}
.sk .bf{background:rgba(255,255,255,.35)}.sk .pr{background:var(--ac)}
.pb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pb button{
  min-width:44px;height:44px;border-radius:50%;font-size:15px;font-weight:700;
  padding:0;display:grid;place-items:center;transition:all 0.2s ease;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);
}
.pb button:hover{background:rgba(255,255,255,0.25);transform:scale(1.1)}
.pb button:active{transform:scale(0.9)}
.pb button svg{width:22px;height:22px;fill:currentColor}
.pb .sp{flex:1}
.tm{font-size:14px;font-variant-numeric:tabular-nums;margin:0 8px}

.pm{
  position:absolute;bottom:84px;right:18px;
  background:rgba(20,20,24,0.85);backdrop-filter:blur(16px);
  border-radius:12px;padding:6px;min-width:150px;max-height:50vh;overflow:auto;
  z-index:3;direction:rtl;border:1px solid var(--ln);
  animation:modalIn 0.2s ease;
}
.pm button{display:block;width:100%;text-align:start;padding:10px 14px;border-radius:8px;font-size:14px;transition:background 0.2s}
.pm button:hover{background:rgba(255,255,255,.14)}
.pm .on{color:var(--ac);font-weight:800}

.pe{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:rgba(0,0,0,.85);z-index:2;direction:rtl}
.pe.s{display:grid}

.adm{padding:120px 4% 110px;max-width:900px}
.adm h1{margin:0;font-size:clamp(24px,5vw,32px);font-weight:900;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hint,.sm{color:var(--mu)}
.sm{font-size:13px;margin:6px 0 0}
.bx{
  border-radius:16px;padding:22px;margin-top:18px;
  transition:transform 0.2s, box-shadow 0.2s;
}
.bx:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.25)}
.bx h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px}
.adm label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
.adm label.ck{display:flex;gap:8px;align-items:center;cursor:pointer}
.adm input,.adm select,.adm textarea{
  width:100%;padding:12px 14px;margin-bottom:8px;border-radius:12px;
  border:1px solid var(--ln);background:var(--s2);color:var(--tx);
  font:inherit;transition:all 0.2s ease;backdrop-filter:blur(8px);
  font-size:16px;
}
.adm input:focus,.adm select:focus,.adm textarea:focus{
  border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,0.15);outline:none;background:var(--s);
}
.adm input[type=checkbox]{width:auto;margin:0;accent-color:var(--ac)}
.adm input[type=color]{height:44px;padding:4px}
.adm input.u,.adm textarea{direction:ltr;text-align:left}
.adm textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.li{
  display:flex;gap:8px;align-items:center;padding:12px 0;
  border-top:1px solid var(--ln);transition:background 0.2s;
}
.li:hover{background:var(--s2);margin:0 -22px;padding:12px 22px;border-radius:8px}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--mu)}
.li .b{padding:6px 14px;font-size:13px;border-radius:8px;flex-shrink:0}

.pub{
  position:fixed;inset:auto 0 0;z-index:30;display:flex;gap:10px;
  align-items:center;padding:14px 4% calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--ln);
}
.pub span{flex:1;font-weight:600}

@media (max-width:768px){
  #top{display:none}
  .mobile-nav{display:block}
  .hero{margin-top:calc(20px + env(safe-area-inset-top,0px));min-height:70vh}
  .ph{padding:20px 4% 14px}
  .adm{padding:20px 4% 100px}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px 10px}
  .card{flex:0 0 clamp(110px,30vw,160px)}
  .mh{height:250px}
  .mh h1{font-size:24px}
  .nav-item span{display:none}

const srt2vtt=t=>"WEBVTT\n\n"+t.replace(/\r/g,"").replace(/(\d+:\d+:\d+),(\d+)/g,"$1.$2");
const T=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=s/60%60|0;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
const posKey=()=>"mc_pos:"+((CUR[CI]||{}).v);
function play(i,x=0){
  CUR=i.eps&&i.eps.length?i.eps:i.v?[{n:i.t,v:i.v,s:i.s||[]}]:[];
  if(!CUR.length){toast("لا يوجد رابط فيديو لهذا العنوان بعد");return}
  closeM();killP();PI=i;
  const p=document.createElement("div");p.id="pl";
  p.innerHTML=`<video playsinline></video><div class="pc"><div class="pt"><button class="ic" data-p="close" aria-label="إغلاق">${ICONS.close}</button><span id="ptl"></span></div><div><div class="sk" id="sk"><i class="bf"></i><i class="pr"></i></div><div class="pb"><button data-p="pp" id="ppb">${ICONS.play}</button><button data-p="-10" aria-label="رجوع 10 ثواني">${ICONS.rewind}</button><button data-p="10" aria-label="تقدم 10 ثواني">${ICONS.forward}</button><button data-p="mute" id="mb">${ICONS.volume}</button><input type="range" id="vol" min="0" max="1" step=".05" value="1" style="width:80px;accent-color:var(--ac)"><span class="tm" id="tm">0:00 / 0:00</span><span class="sp"></span><button data-p="next" id="nx">${ICONS.next}</button><button data-p="eps" id="eb">${ICONS.list}</button><button data-p="spd">1×</button><button data-p="cc">CC</button><button data-p="q" id="qb">HD</button><button data-p="pip" aria-label="صورة داخل صورة">${ICONS.pip}</button><button data-p="fs" aria-label="شاشة كاملة">${ICONS.fullscreen}</button></div></div></div><div class="pe" id="pe"><div><p id="pem"></p><button class="b a" data-p="retry">إعادة المحاولة</button></div></div>`;
  document.body.appendChild(p);document.body.style.overflow="hidden";
  PL=p;V=p.querySelector("video");
  const sk=$("#sk");
  V.onclick=tog;V.ondblclick=fs;
  V.ontimeupdate=()=>{const d=V.duration||0;sk.querySelector(".pr").style.width=d?V.currentTime/d*100+"%":"0";$("#tm").textContent=T(V.currentTime)+" / "+T(d);if(Date.now()-lp>4000){lp=Date.now();try{localStorage.setItem(posKey(),V.currentTime)}catch(e){}}};
  V.onprogress=()=>{const b=V.buffered;if(b.length)sk.querySelector(".bf").style.width=b.end(b.length-1)/(V.duration||1)*100+"%"};
  V.onplay=V.onpause=()=>{const b=$("#ppb");if(b)b.innerHTML=V.paused?ICONS.play:ICONS.pause};
  V.onended=()=>{if(CI<CUR.length-1)load(CI+1)};
  V.onerror=()=>err("تعذّر تشغيل الفيديو. تأكد أن الرابط https ويعمل، وأن الخادم يسمح بالتشغيل من نطاق آخر (CORS).");
  V.onloadedmetadata=()=>{const s=+localStorage.getItem(posKey());if(s>10&&s<V.duration-30)V.currentTime=s};
  sk.onclick=e=>{const r=sk.getBoundingClientRect();V.currentTime=(e.clientX-r.left)/r.width*V.duration};
  $("#vol").oninput=e=>{V.volume=e.target.value;V.muted=false};
  p.onclick=e=>{const b=e.target.closest("[data-p]");if(b)pact(b.dataset.p,b);else if(!e.target.closest(".pm"))menuClose()};
  p.onmousemove=p.ontouchstart=wake;
  wake();load(x);
}
function wake(){if(!PL)return;PL.classList.remove("hide");clearTimeout(ht);ht=setTimeout(()=>{if(PL&&V&&!V.paused&&!PL.querySelector(".pm"))PL.classList.add("hide")},3000)}
const tog=()=>V&&(V.paused?V.play():V.pause());
const fs=()=>document.fullscreenElement?document.exitFullscreen():PL&&PL.requestFullscreen&&PL.requestFullscreen();
const err=m=>{const e=$("#pe");if(e){$("#pem").textContent=m;e.classList.add("s")}};
async function load(x){
  CI=x;const e=CUR[x];
  if(hls){hls.destroy();hls=null}
  $("#pe").classList.remove("s");
  $("#ptl").textContent=PI.t+(CUR.length>1?" · "+e.n:"");
  $("#nx").style.display=x<CUR.length-1?"":"none";
  $("#eb").style.display=CUR.length>1?"":"none";
  $("#qb").style.display="none";
  V.querySelectorAll("track").forEach(t=>t.remove());
  if(/\.m3u8($|\?)/i.test(e.v)&&window.Hls&&Hls.isSupported()){
    hls=new Hls();
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)err("تعذّر تحميل البث (m3u8). تحقق من الرابط وإعدادات CORS على خادم الفيديو.")});
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{$("#qb").style.display=hls.levels.length>1?"":"none"});
    hls.loadSource(e.v);hls.attachMedia(V);
  }else V.src=e.v;
  for(const [j,s] of (e.s||[]).entries()){
    let u=s.u;
    if(/\.srt($|\?)/i.test(u)){try{u=URL.createObjectURL(new Blob([srt2vtt(await(await fetch(u)).text())],{type:"text/vtt"}))}catch(_){toast("تعذّر تحميل ترجمة SRT، استخدم ملف VTT");continue}}
    const t=document.createElement("track");t.kind="subtitles";t.src=u;t.srclang=s.l;t.label=LANG[s.l]||s.l;t.default=j==0;V.appendChild(t);
  }
  V.play().catch(()=>{});
}
function menu(b,o){
  const had=PL.querySelector(".pm");menuClose();if(had&&had.dataset.b==b.dataset.p)return;
  const m=document.createElement("div");m.className="pm";m.dataset.b=b.dataset.p;
  m.innerHTML=o.map((x,j)=>`<button data-m="${j}" class="${x.on?"on":""}">${esc(x.l)}</button>`).join("");
  m.onclick=e=>{const k=e.target.closest("[data-m]");if(k){o[k.dataset.m].f();menuClose()}e.stopPropagation()};
  PL.appendChild(m);
}
const menuClose=()=>PL&&PL.querySelectorAll(".pm").forEach(x=>x.remove());
function pact(a,b){
  if(a=="close")return killP();
  if(a=="pp")tog();
  else if(a=="-10"||a=="10")V.currentTime+=+a;
  else if(a=="mute"){V.muted=!V.muted;$("#mb").innerHTML=V.muted?ICONS.mute:ICONS.volume}
  else if(a=="next")load(CI+1);
  else if(a=="retry")load(CI);
  else if(a=="fs")fs();
  else if(a=="pip"){try{document.pictureInPictureElement?document.exitPictureInPicture():V.requestPictureInPicture()}catch(e){}}
  else if(a=="spd")menu(b,[.5,.75,1,1.25,1.5,2].map(s=>({l:s+"×",on:V.playbackRate==s,f:()=>{V.playbackRate=s;b.textContent=s+"×"}})));
  else if(a=="eps")menu(b,CUR.map((e,x)=>({l:e.n,on:x==CI,f:()=>load(x)})));
  else if(a=="cc"){const t=[...V.textTracks];menu(b,[{l:"إيقاف",on:t.every(x=>x.mode!="showing"),f:()=>t.forEach(x=>x.mode="disabled")},...t.map(x=>({l:x.label||"ترجمة",on:x.mode=="showing",f:()=>t.forEach(y=>y.mode=y==x?"showing":"disabled")}))])}
  else if(a=="q"&&hls)menu(b,[{l:"تلقائي",on:hls.currentLevel==-1,f:()=>hls.currentLevel=-1},...hls.levels.map((l,i)=>({l:l.height+"p",on:hls.currentLevel==i,f:()=>hls.currentLevel=i}))]);
}
function killP(){
  if(hls){hls.destroy();hls=null}
  const p=$("#pl");
  if(p){if(V){try{localStorage.setItem(posKey(),V.currentTime)}catch(e){}}if(document.fullscreenElement)document.exitFullscreen();p.remove()}
  document.body.style.overflow="";V=null;PL=null;
}
const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
const parseM3U=t=>{const o=[];let nm="";for(const r of t.split(/\r?\n/)){const l=r.trim();if(!l)continue;if(l.startsWith("#EXTINF"))nm=l.split(",").slice(1).join(",").trim();else if(!l.startsWith("#")){o.push({n:nm||"حلقة "+(o.length+1),v:l});nm=""}}return o};
const parseSubs=t=>lines(t).map(x=>{const p=x.split("|").map(s=>s.trim());return p.length>1?{l:p[0],u:p[1]}:{l:"ar",u:p[0]}});
const parseEps=t=>/#EXTM3U|#EXTINF/.test(t)?parseM3U(t).map(e=>({...e,s:[]})):lines(t).map((x,j)=>{const p=x.split("|").map(s=>s.trim());if(p.length==1)return{n:"حلقة "+(j+1),v:p[0],s:[]};return{n:p[0]||"حلقة "+(j+1),v:p[1]||"",s:p[2]?[{l:p[3]||"ar",u:p[2]}]:[]}}).filter(e=>e.v);

function admin(){
  const it=find(editing)||{},v=(f,d="")=>esc(it[f]??d);
  const opts=s=>Object.entries(CAT).map(([k,c])=>`<option value="${k}" ${s==k?"selected":""}>${c.n}</option>`).join("");
  const ep=(it.eps||[]).map(e=>[e.n,e.v,e.s?.[0]?.u||"",e.s?.[0]?.l||""].join(" | ").replace(/( \| )+$/,"")).join("\n");
  const sb=(it.s||[]).map(s=>s.l+"|"+s.u).join("\n");
  return `<div class="adm"><h1>${ICONS.settings} لوحة تحكم MOVFLY</h1><p class="hint">مرحباً بك في لوحة التحكم. يمكنك هنا إضافة وتعديل الأفلام والمسلسلات بمختلف الصيغ، وإدارة روابط الترجمة وصور الغلاف بكل سهولة.</p>
<div class="bx glass"><h2>🌐 إعدادات الموقع</h2><div class="two"><div><label>اسم الموقع</label><input id="sn" value="${esc(DATA.site.name)}"></div><div><label>لون التمييز (Theme Color)</label><input id="sc" type="color" value="${esc(DATA.site.accent||"#7c5cff")}"></div></div><div class="two"><div><label>🔐 كلمة مرور لوحة التحكم</label><input id="sp" type="password" value="${esc(DATA.site.password||"admin123")}" placeholder="admin123"></div></div><div class="acts"><button class="b s" data-a2="site">حفظ الإعدادات</button></div></div>
<div class="bx glass"><h2>${editing?"✏️ تعديل عنوان":"➕ إضافة عنوان جديد"}</h2>
<div class="two"><div><label>القسم</label><select id="ak">${opts(it.k)}</select></div><div><label>اسم العمل</label><input id="at" value="${v("t")}"></div></div>
<div class="two"><div><label>سنة الإصدار</label><input id="ay" value="${v("y")}"></div><div><label>النوع (تصنيف)</label><input id="ag" value="${v("g")}" placeholder="دراما، أكشن، خيال علمي..."></div></div>
<label>الوصف المختصر</label><textarea id="ad" style="direction:rtl;text-align:right">${v("d")}</textarea>
<div class="two"><div><label>🖼️ صورة الغلاف (عمودية)</label><input class="u" id="ai" value="${v("img")}" placeholder="رابط صورة الغلاف (Poster)"><input type="file" id="afi" accept="image/*"></div><div><label>🌄 صورة الخلفية (عريضة)</label><input class="u" id="ab" value="${v("bg")}" placeholder="رابط صورة الخلفية (Backdrop)"><input type="file" id="afb" accept="image/*"></div></div>
<label>🎨 درجة لون الغلاف (عند غياب الصورة)</label><input id="ah" type="range" min="0" max="360" value="${it.h??200}">
<div class="two"><label class="ck"><input id="ap" type="checkbox" ${it.p?"checked":""}> 📌 تثبيت في "المثبّتة"</label><label class="ck"><input id="ahr" type="checkbox" ${it.hero?"checked":""}> 🌟 عرضه كبطل في الصفحة الرئيسية</label></div>
<hr style="border:0;border-top:1px solid var(--ln);margin:18px 0">
<label>🎬 رابط الفيديو (يدعم جميع الصيغ: MP4, MKV, M3U8, إلخ)</label><input class="u" id="av" value="${v("v")}" placeholder="https://example.com/movie.mp4 أو .m3u8">
<label>📝 روابط الترجمة (VTT أو SRT): سطر لكل لغة</label><textarea id="as" placeholder="ar|https://example.com/arabic.vtt&#10;en|https://example.com/english.srt">${esc(sb)}</textarea>
<label>📺 الحلقات (للمسلسلات والأنمي فقط)</label><textarea id="ae" placeholder="الحلقة 1 | https://example.com/e1.mp4 | https://example.com/e1.vtt | ar&#10;أو الصق قائمة m3u كاملة">${esc(ep)}</textarea>
<p class="sm">💡 تنسيق الحلقات: اسم الحلقة | رابط الفيديو | رابط الترجمة (اختياري) | رمز اللغة (اختياري)</p>
<div class="acts"><button class="b a" data-a2="save">💾 حفظ العنوان</button>${editing?`<button class="b s" data-a2="cancel">إلغاء</button>`:""}</div></div>
<div class="bx glass"><h2>📥 استيراد قائمة تشغيل (M3U)</h2><p class="sm">سيتم تحويل كل رابط في القائمة إلى عنوان مستقل في القسم المختار.</p><textarea id="bm" placeholder="#EXTM3U&#10;#EXTINF:-1,اسم العمل&#10;https://example.com/a.m3u8"></textarea><div class="acts"><select id="bk" style="width:auto">${opts("movies")}</select><button class="b s" data-a2="bulk">استيراد</button></div></div>
<div class="bx glass"><h2>📚 إدارة العناوين (${DATA.items.length})</h2>${DATA.items.map(i=>`<div class="li"><span>${esc(i.t)} <small>· ${CAT[i.k].n}${i.v||(i.eps||[]).length?" · ▶":""}${i.img?" · 🖼":""}</small></span><button class="b s" data-edit="${esc(i.id)}">تعديل</button><button class="b s" style="color:#f2479f" data-del="${esc(i.id)}">حذف</button></div>`).join("")}</div></div>
<div class="pub glass"><span>${DRAFT?"⚠️ لديك تغييرات غير منشورة":"✅ لا توجد تغييرات غير منشورة"}</span><button class="b s" data-a2="copy">📋 نسخ البيانات</button><button class="b a" data-a2="pub">🚀 نشر التغييرات</button></div>`;
}

function save(){
  const t=$("#at").value.trim();if(!t){toast("أدخل اسم العمل");return}
  const o={id:editing||"u"+Date.now(),k:$("#ak").value,t,y:$("#ay").value.trim(),g:$("#ag").value.trim()||"متنوع",d:$("#ad").value.trim(),h:+$("#ah").value,img:$("#ai").value.trim(),bg:$("#ab").value.trim(),p:$("#ap").checked?1:0,hero:$("#ahr").checked?1:0,v:$("#av").value.trim(),s:parseSubs($("#as").value),eps:parseEps($("#ae").value)};
  if(o.hero)DATA.items.forEach(x=>x.hero=0);
  const j=DATA.items.findIndex(x=>x.id==o.id);j<0?DATA.items.push(o):DATA.items[j]=o;
  editing="";dirty();view();scrollTo(0,0);toast("تم الحفظ. اضغط «نشر التغييرات» ليراها الزوار");
}
function bulk(){
  const L=parseM3U($("#bm").value);if(!L.length){toast("لا توجد روابط في القائمة");return}
  const k=$("#bk").value,t=Date.now();
  L.forEach((e,j)=>DATA.items.push({id:"u"+t+"_"+j,k,t:e.n,y:"",g:"متنوع",d:"",h:(j*47)%360,img:"",bg:"",p:0,hero:0,v:e.v,s:[],eps:[]}));
  dirty();view();toast("تم استيراد "+L.length+" عنوان");
}
const buildDoc=()=>{
  const j=JSON.stringify(DATA).replace(/</g,"\\u003c");
  const f=h=>PARTS.filter(p=>p.h==h).map(p=>p.c?`<script type="application/json" id="catalog" data-a>${j}</`+`script>`:p.x).join("\n");
  return `<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n${f(true)}\n</head>\n<body>\n${f(false)}\n</body>\n</html>`;
};
async function publish(){
  if(!ART){toast("النشر غير متاح في هذا العرض. استخدم «نسخ البيانات»");return}
  const doc=buildDoc();
  if(!doc.includes("const PARTS")){toast("تعذّر تجهيز الصفحة للنشر");return}
  try{await ART.publish(doc)}catch(e){toast(e.code=="conflict"?"نُشرت نسخة أحدث، أعد تحميل الصفحة":e.code=="not_writer"||e.code=="not_granted"?"ليست لديك صلاحية النشر":"تعذّر النشر ("+(e.code||"؟")+")")}
}
async function shrink(f,max){const b=await createImageBitmap(f),r=Math.min(1,max/b.width),c=document.createElement("canvas");c.width=b.width*r;c.height=b.height*r;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.86))}
function act(a){
  if(a=="close")closeM();
  else if(a=="srch"){const q=$("#q");q.classList.toggle("o");if(q.classList.contains("o"))q.focus()}
  else if(a=="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="light"?"dark":"light"}
  else if(a=="site"){DATA.site.name=$("#sn").value.trim()||"MOVFLY";DATA.site.accent=$("#sc").value;DATA.site.password=$("#sp").value||"admin123";dirty();render();toast("تم الحفظ")}
  else if(a=="save")save();
  else if(a=="cancel"){editing="";view()}
  else if(a=="bulk")bulk();
  else if(a=="pub")publish();
  else if(a=="copy"){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(DATA)):Promise.reject()).then(()=>toast("تم نسخ البيانات"),()=>toast("تعذّر النسخ"))}
}
document.addEventListener("click",e=>{
  const t=e.target;let x;
  if(x=t.closest("[data-sc]")){const r=x.parentElement.querySelector(".rail");r.scrollBy({left:x.dataset.sc*r.clientWidth*.85,behavior:"smooth"});return}
  if(x=t.closest("[data-g]")){gf=x.dataset.g;view();return}
  if(x=t.closest("[data-play]")){play(find(x.dataset.play));return}
  if(x=t.closest("[data-eplay]")){play(INFO,+x.dataset.eplay);return}
  if(x=t.closest("[data-info]")){info(find(x.dataset.info));return}
  if(x=t.closest(".card")){info(find(x.dataset.id));return}
  if(x=t.closest("[data-edit]")){editing=x.dataset.edit;view();scrollTo(0,0);return}
  if(x=t.closest("[data-del]")){DATA.items=DATA.items.filter(i=>i.id!=x.dataset.del);dirty();view();toast("تم الحذف");return}
  if(x=t.closest("[data-a2]")){act(x.dataset.a2);return}
  if(t.classList.contains("mv"))closeM();
});
document.addEventListener("input",e=>{if(e.target.id=="q"){qs=e.target.value.trim();view()}});
document.addEventListener("change",async e=>{
  const t=e.target;if(t.id!="afi"&&t.id!="afb")return;
  const f=t.files[0];if(!f)return;
  if(!AS){toast("رفع الصور غير متاح هنا");return}
  toast("جارٍ رفع الصورة...");
  try{let b;try{b=await shrink(f,t.id=="afi"?700:1600)}catch(_){b=f}const a=await AS.upload(b,b===f?undefined:{type:"image/jpeg"});$(t.id=="afi"?"#ai":"#ab").value="/_blob/"+a.id;toast("تم رفع الصورة. اضغط «حفظ» لتثبيتها")}catch(x){toast("تعذّر رفع الصورة ("+(x.code||"؟")+")")}
});
document.addEventListener("keydown",e=>{
  if(document.querySelector(".password-modal")){
    if(e.key==="Escape")closePasswordModal();
    return;
  }
  if(!PL){if(e.key=="Escape")closeM();return}
  if(e.target.matches("textarea,input[type=text]"))return;
  const k=e.key;
  if(k==" "||k=="k"){e.preventDefault();tog()}
  else if(k=="ArrowLeft")V.currentTime-=10;
  else if(k=="ArrowRight")V.currentTime+=10;
  else if(k=="ArrowUp"){e.preventDefault();V.volume=Math.min(1,V.volume+.1)}
  else if(k=="ArrowDown"){e.preventDefault();V.volume=Math.max(0,V.volume-.1)}
  else if(k=="f")fs();
  else if(k=="m")pact("mute");
  else if(k=="c")pact("cc",PL.querySelector("[data-p=cc]"));
  else if(k=="Escape"&&!document.fullscreenElement)killP();
  wake();
});
addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>30));
addEventListener("hashchange",()=>{gf="";qs="";editing="";render();scrollTo(0,0)});

checkPassword();
render();
</script>
</body>
</html>
