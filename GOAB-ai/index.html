<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAB AI</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="background-gradient"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<aside class="sidebar glass" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">G</div>
      <span class="logo-text">GOAB AI</span>
    </div>
    <button class="icon-btn" id="toggleSidebar" title="إغلاق">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3h18v18H3z"/><path d="M9 3v18"/>
      </svg>
    </button>
  </div>

  <button class="new-chat-btn" id="newChatBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    محادثة جديدة
  </button>

  <div class="chat-history" id="chatHistory"></div>

  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle">
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span>تبديل الوضع</span>
    </button>
  </div>
</aside>

<main class="main" id="main">
  <header class="topbar glass">
    <button class="icon-btn" id="openSidebar" title="القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <div class="model-name">GOAB AI · Powerful Model</div>
    <div class="spacer"></div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">G</div>
      <h1>مرحباً بك في GOAB AI</h1>
      <p>كيف يمكنني مساعدتك اليوم؟</p>
      <div class="suggestions">
        <button class="suggestion glass" data-prompt="اشرح لي مفهوم الذكاء الاصطناعي ببساطة">
          <span class="suggestion-title">اشرح لي</span>
          <span class="suggestion-text">مفهوم الذكاء الاصطناعي ببساطة</span>
        </button>
        <button class="suggestion glass" data-prompt="اكتب لي كود Python لفرز قائمة">
          <span class="suggestion-title">اكتب كود</span>
          <span class="suggestion-text">Python لفرز قائمة</span>
        </button>
        <button class="suggestion glass" data-prompt="أعطني أفكار مشاريع إبداعية">
          <span class="suggestion-title">أفكار</span>
          <span class="suggestion-text">لمشاريع إبداعية</span>
        </button>
      </div>
    </div>

    <div class="messages" id="messages"></div>
  </div>

  <div class="input-area">
    <div class="input-wrapper glass">
      <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p class="disclaimer">GOAB AI قد يخطئ. تحقق من المعلومات المهمة.</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
